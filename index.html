<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Qi | Lian Thye & Co Pte Ltd</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans & Fredoka for light-hearted geometric warmth -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- QRious QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['"Fredoka"', 'sans-serif'],
                    },
                    colors: {
                        toy: {
                            coral: '#FF5A5F',
                            yellow: '#FFB400',
                            sky: '#00A8E8',
                            mint: '#10B981',
                            cream: '#FFFDF9',
                            slate: '#1E293B'
                        }
                    },
                    boxShadow: {
                        'card': '0 20px 40px -15px rgba(30, 41, 59, 0.08), 0 0 1px 1px rgba(30, 41, 59, 0.04)',
                        'tactile': '0 4px 0 0 #E11D48',
                        'tactile-active': '0 1px 0 0 #E11D48',
                    }
                }
            }
        }
    </script>

    <style>
        /* Subtle playful background pattern */
        body {
            background-color: #FFFDF9;
            background-image: 
                radial-gradient(#FFB400 1.2px, transparent 1.2px), 
                radial-gradient(#00A8E8 1.2px, #FFFDF9 1.2px);
            background-size: 48px 48px;
            background-position: 0 0, 24px 24px;
            background-attachment: fixed;
        }

        /* Floating animation for decorative toy blocks */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(4deg); }
        }
        @keyframes floatReverse {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(5px) rotate(-5deg); }
        }
        .animate-float-1 { animation: floatSlow 5s ease-in-out infinite; }
        .animate-float-2 { animation: floatReverse 6s ease-in-out infinite; }

        /* Smooth modal transitions */
        .modal-backdrop {
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        .modal-content {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 text-slate-800 antialiased selection:bg-toy-yellow/30">

    <!-- Decorative Floating Background Shapes (Desktop) -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0 hidden sm:block">
        <!-- Red Toy Brick Top Left -->
        <svg class="absolute top-12 left-12 w-16 h-16 text-toy-coral/15 animate-float-1" viewBox="0 0 64 64" fill="currentColor">
            <rect x="8" y="20" width="48" height="32" rx="6" />
            <rect x="14" y="12" width="12" height="10" rx="3" />
            <rect x="38" y="12" width="12" height="10" rx="3" />
        </svg>
        <!-- Yellow Star Bottom Right -->
        <svg class="absolute bottom-14 right-14 w-20 h-20 text-toy-yellow/20 animate-float-2" viewBox="0 0 64 64" fill="currentColor">
            <path d="M32 6l7.5 16.5L57 25l-13 12.2L47.3 55 32 46.2 16.7 55 20 37.2 7 25l17.5-2.5z" stroke-linejoin="round"/>
        </svg>
        <!-- Sky Blue Circle Top Right -->
        <svg class="absolute top-20 right-20 w-14 h-14 text-toy-sky/15 animate-float-2" viewBox="0 0 64 64" fill="currentColor">
            <circle cx="32" cy="32" r="24" />
        </svg>
    </div>

    <!-- Main Digital Business Card Container -->
    <main class="relative z-10 w-full max-w-md bg-white/95 backdrop-blur-md rounded-[2rem] shadow-card border border-slate-100 overflow-hidden transition-all duration-300">
        
        <!-- Top Playful Color Block Header with Singapore & Malaysia Flags -->
        <div class="relative h-44 bg-gradient-to-br from-amber-50 via-sky-50 to-rose-50 overflow-hidden border-b border-slate-100 flex flex-col justify-between">
            <!-- Top Color Strip (Building Block Palette) -->
            <div class="flex h-2 w-full shrink-0">
                <div class="w-1/4 bg-toy-coral"></div>
                <div class="w-1/4 bg-toy-yellow"></div>
                <div class="w-1/4 bg-toy-sky"></div>
                <div class="w-1/4 bg-toy-mint"></div>
            </div>

            <!-- Decorative Geometric Play Shapes inside Banner -->
            <svg class="absolute -right-6 -bottom-8 w-36 h-36 text-toy-yellow/20 animate-float-1 pointer-events-none" viewBox="0 0 100 100" fill="currentColor">
                <circle cx="50" cy="50" r="40" />
            </svg>
            <svg class="absolute left-4 top-6 w-12 h-12 text-toy-sky/20 animate-float-2 pointer-events-none" viewBox="0 0 64 64" fill="currentColor">
                <rect x="8" y="22" width="48" height="28" rx="6" />
                <rect x="14" y="14" width="12" height="10" rx="2" />
                <rect x="38" y="14" width="12" height="10" rx="2" />
            </svg>

            <!-- Center Banner Showcase: Singapore & Malaysia Flags -->
            <div class="relative z-10 my-auto pt-3 flex items-center justify-center gap-6">
                <!-- Singapore Flag -->
                <div class="w-20 h-14 rounded-xl overflow-hidden shadow-md rotate-[-3deg] hover:rotate-0 transition-transform duration-300">
                    <svg viewBox="0 0 60 40" class="w-full h-full block">
                        <rect width="60" height="20" fill="#EE2536"/>
                        <rect y="20" width="60" height="20" fill="#FFFFFF"/>
                        <!-- Crescent -->
                        <circle cx="14.5" cy="10" r="6.2" fill="#FFFFFF"/>
                        <circle cx="16.3" cy="10" r="5.2" fill="#EE2536"/>
                        <!-- 5 Stars -->
                        <g fill="#FFFFFF">
                            <polygon points="16.5,5.2 17.0,6.6 18.4,6.6 17.3,7.4 17.7,8.8 16.5,8.0 15.3,8.8 15.7,7.4 14.6,6.6 16.0,6.6"/>
                            <polygon points="20.2,7.8 20.7,9.2 22.1,9.2 21.0,10.0 21.4,11.4 20.2,10.6 19.0,11.4 19.4,10.0 18.3,9.2 19.7,9.2"/>
                            <polygon points="18.8,12.2 19.3,13.6 20.7,13.6 19.6,14.4 20.0,15.8 18.8,15.0 17.6,15.8 18.0,14.4 16.9,13.6 18.3,13.6"/>
                            <polygon points="14.2,12.2 14.7,13.6 16.1,13.6 15.0,14.4 15.4,15.8 14.2,15.0 13.0,15.8 13.4,14.4 12.3,13.6 13.7,13.6"/>
                            <polygon points="12.8,7.8 13.3,9.2 14.7,9.2 13.6,10.0 14.0,11.4 12.8,10.6 11.6,11.4 12.0,10.0 10.9,9.2 12.3,9.2"/>
                        </g>
                    </svg>
                </div>

                <!-- Malaysia Flag -->
                <div class="w-20 h-14 rounded-xl overflow-hidden shadow-md rotate-[3deg] hover:rotate-0 transition-transform duration-300">
                    <svg viewBox="0 0 60 40" class="w-full h-full block">
                        <!-- White Base -->
                        <rect width="60" height="40" fill="#FFFFFF"/>
                        <!-- Red Stripes -->
                        <g fill="#CC0001">
                            <rect y="0" width="60" height="2.85"/>
                            <rect y="5.7" width="60" height="2.85"/>
                            <rect y="11.4" width="60" height="2.85"/>
                            <rect y="17.1" width="60" height="2.85"/>
                            <rect y="22.8" width="60" height="2.85"/>
                            <rect y="28.5" width="60" height="2.85"/>
                            <rect y="34.2" width="60" height="2.85"/>
                        </g>
                        <!-- Blue Canton -->
                        <rect width="30" height="22.8" fill="#010066"/>
                        <!-- Yellow Crescent -->
                        <circle cx="12.5" cy="11.4" r="6" fill="#FFCC00"/>
                        <circle cx="14.2" cy="11.4" r="5" fill="#010066"/>
                        <!-- Yellow Starburst -->
                        <g fill="#FFCC00" transform="translate(20.5, 11.4)">
                            <polygon points="0,-5.2 1.2,-1.6 4.8,-2.8 2.1,0 4.8,2.8 1.2,1.6 0,5.2 -1.2,1.6 -4.8,2.8 -2.1,0 -4.8,-2.8 -1.2,-1.6"/>
                            <circle r="2.2"/>
                        </g>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Identity & Contact Section -->
        <div class="px-6 pt-5 pb-6 relative">
            <!-- Name, Verified Badge, Role & Company -->
            <div>
                <div class="flex items-center justify-between gap-2 flex-wrap">
                    <div class="flex items-center gap-2 flex-wrap">
                        <h1 id="displayName" class="font-display text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Min Qi</h1>
                        <span class="inline-flex items-center justify-center bg-toy-mint text-white p-1 rounded-full shadow-sm" title="Verified Business Contact">
                            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                            </svg>
                        </span>
                        <span id="displayRoleBadge" class="hidden bg-sky-50 text-toy-sky border border-sky-200/60 text-xs font-semibold px-2.5 py-0.5 rounded-full"></span>
                    </div>
                    <span class="text-[11px] font-semibold bg-amber-50 text-amber-800 border border-amber-200/70 px-2.5 py-1 rounded-full">
                        SG & MY Distribution
                    </span>
                </div>
                
                <div class="mt-1.5 flex items-center gap-1.5 text-slate-700 font-semibold text-base">
                    <svg class="w-4 h-4 text-toy-coral shrink-0" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 7h-2V5a2
