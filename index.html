<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Min Qi | Lian Thye & Co Pte Ltd</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FFFDF9;
      background-image: 
        radial-gradient(#FF6B6B 1.2px, transparent 1.2px), 
        radial-gradient(#4ECDC4 1.2px, #FFFDF9 1.2px);
      background-size: 48px 48px;
      background-position: 0 0, 24px 24px;
    }
    .toy-shadow {
      box-shadow: 0 12px 32px -8px rgba(30, 41, 59, 0.12), 0 4px 0 0 #E2E8F0;
    }
    .btn-toy {
      transition: all 0.15s ease;
      box-shadow: 0 4px 0 0 #C84B31;
    }
    .btn-toy:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 0 #C84B31;
    }
    .btn-secondary {
      transition: all 0.15s ease;
      box-shadow: 0 4px 0 0 #CBD5E1;
    }
    .btn-secondary:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 0 #CBD5E1;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 py-8 text-slate-800 relative overflow-x-hidden">

  <!-- Main Card Container -->
  <main class="w-full max-w-md bg-white rounded-3xl border-2 border-slate-200 toy-shadow overflow-hidden relative z-10">
    
    <!-- Top Banner with Singapore & Malaysia Flags (No top-right QR button, no white background, no arrows) -->
    <div class="h-36 bg-gradient-to-r from-amber-100 via-rose-100 to-sky-100 relative flex items-center justify-center overflow-hidden border-b-2 border-slate-100">
      <!-- Subtle Decorative Circles -->
      <div class="absolute -top-6 -left-6 w-20 h-20 rounded-full bg-amber-300/30"></div>
      <div class="absolute -bottom-8 -right-6 w-24 h-24 rounded-full bg-sky-300/30"></div>

      <!-- Flags Side-by-Side -->
      <div class="flex items-center gap-6 z-10">
        <!-- Singapore Flag SVG -->
        <svg class="w-20 h-14 rounded-lg shadow-md border border-black/5" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
          <rect width="60" height="20" fill="#EE2536"/>
          <rect y="20" width="60" height="20" fill="#FFFFFF"/>
          <circle cx="14.5" cy="10" r="6.8" fill="#FFFFFF"/>
          <circle cx="17" cy="10" r="6.2" fill="#EE2536"/>
          <g fill="#FFFFFF" transform="translate(18.5, 10)">
            <circle cx="0" cy="-3.8" r="1"/>
            <circle cx="3.6" cy="-1.2" r="1"/>
            <circle cx="2.2" cy="3.1" r="1"/>
            <circle cx="-2.2" cy="3.1" r="1"/>
            <circle cx="-3.6" cy="-1.2" r="1"/>
          </g>
        </svg>

        <!-- Malaysia Flag SVG -->
        <svg class="w-20 h-14 rounded-lg shadow-md border border-black/5" viewBox="0 0 56 28" xmlns="http://www.w3.org/2000/svg">
          <rect width="56" height="28" fill="#FFFFFF"/>
          <g fill="#CC0001">
            <rect y="0" width="56" height="2"/>
            <rect y="4" width="56" height="2"/>
            <rect y="8" width="56" height="2"/>
            <rect y="12" width="56" height="2"/>
            <rect y="16" width="56" height="2"/>
            <rect y="20" width="56" height="2"/>
            <rect y="24" width="56" height="2"/>
          </g>
          <rect width="28" height="16" fill="#010066"/>
          <circle cx="11.5" cy="8" r="5.2" fill="#FFCC00"/>
          <circle cx="13.2" cy="8" r="4.5" fill="#010066"/>
          <polygon points="18,4.2 19,6.8 21.8,6.8 19.5,8.4 20.4,11 18,9.4 15.6,11 16.5,8.4 14.2,6.8 17,6.8" fill="#FFCC00"/>
        </svg>
      </div>
    </div>

    <!-- Identity & Company Header -->
    <div class="px-6 pt-7 pb-6 text-center">
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-bold tracking-wide uppercase mb-3 border border-amber-200">
        <span>🧸</span> Toy Distribution • SG & MY
      </div>
      
      <h1 id="displayName" class="text-3xl font-extrabold text-slate-900 tracking-tight">Min Qi</h1>
      <p id="displayTitle" class="text-sm font-semibold text-rose-500 mt-1 hidden"></p>
      <p id="displayCompany" class="text-base font-bold text-slate-600 mt-1">Lian Thye & Co Pte Ltd</p>

      <!-- Primary Action Buttons -->
      <div class="grid grid-cols-5 gap-3 mt-6">
        <button onclick="downloadVCF()" class="col-span-3 btn-toy bg-[#FF5A36] hover:bg-[#F04E2A] text-white font-bold py-3.5 px-4 rounded-2xl flex items-center justify-center gap-2 text-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
          </svg>
          <span>Save to Contacts</span>
        </button>

        <button onclick="openQRModal()" class="col-span-2 btn-secondary bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-3.5 px-4 rounded-2xl border border-slate-300 flex items-center justify-center gap-2 text-sm">
          <svg class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/>
          </svg>
          <span>
